<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Trading App</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: #f3f4f6;
      padding: 15px 5px;
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #16a34a;
      color: white;
    }

    .sell {
      background: #dc2626;
      color: white;
    }

    .reset {
      width: 100%;
      margin-top: 15px;
      background: #374151;
      color: white;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .demo {
      background: #fff7ed;
      color: #9a3412;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📈 Deriv Trading App</h1>
    <p>Demo Trading Dashboard</p>
  </div>

  <div class="container">

    <div class="card">

      <div class="demo">
        DEMO MODE — No real money is being traded
      </div>

      <label for="market">Market</label>

      <select id="market">
        <option>Volatility 10 Index</option>
        <option>Volatility 25 Index</option>
        <option>Volatility 50 Index</option>
        <option>Volatility 75 Index</option>
        <option>Volatility 100 Index</option>
        <option>Boom 300 Index</option>
        <option>Boom 500 Index</option>
        <option>Boom 1000 Index</option>
        <option>Crash 300 Index</option>
        <option>Crash 500 Index</option>
        <option>Crash 1000 Index</option>
      </select>

      <label for="stake">Fixed Stake</label>

      <input
        type="number"
        id="stake"
        value="10"
        min="0.35"
        step="0.01"
      >

      <div class="buttons">
        <button class="buy" onclick="demoTrade('WIN')">
          📈 DEMO BUY
        </button>

        <button class="sell" onclick="demoTrade('LOSS')">
          📉 DEMO LOSS
        </button>
      </div>

      <div id="status">
        Ready for demo trading
      </div>

    </div>

    <div class="card">

      <h2>📊 Trading Statistics</h2>

      <div class="stats">

        <div class="stat">
          Trades
          <strong id="trades">0</strong>
        </div>

        <div class="stat">
          Wins
          <strong id="wins">0</strong>
        </div>

        <div class="stat">
          Losses
          <strong id="losses">0</strong>
        </div>

      </div>

      <p>
        Demo Balance:
        <strong>$<span id="balance">1000.00</span></strong>
      </p>

      <button class="reset" onclick="resetStats()">
        Reset Statistics
      </button>

    </div>

  </div>

<script>

let trades = 0;
let wins = 0;
let losses = 0;
let balance = 1000;

function demoTrade(result) {

  const stake =
    parseFloat(document.getElementById("stake").value);

  if (!stake || stake <= 0) {
    document.getElementById("status").innerText =
      "Enter a valid stake.";
    return;
  }

  trades++;

  if (result === "WIN") {

    wins++;

    balance += stake;

    document.getElementById("status").innerText =
      "✅ Demo trade WIN — Stake: $" + stake.toFixed(2);

  } else {

    losses++;

    balance -= stake;

    document.getElementById("status").innerText =
      "❌ Demo trade LOSS — Stake: $" + stake.toFixed(2);
  }

  updateStats();
}

function updateStats() {

  document.getElementById("trades").innerText = trades;
  document.getElementById("wins").innerText = wins;
  document.getElementById("losses").innerText = losses;

  document.getElementById("balance").innerText =
    balance.toFixed(2);
}

function resetStats() {

  trades = 0;
  wins = 0;
  losses = 0;
  balance = 1000;

  updateStats();

  document.getElementById("status").innerText =
    "Statistics reset.";
}

</script>

</body>
</html>
