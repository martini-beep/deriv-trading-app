<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Trading Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: #151f33;
      padding: 18px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    input,
    select {
      background: #26334d;
      color: white;
    }

    button {
      margin-top: 10px;
      background: #00a86b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.stop {
      background: #d93636;
    }

    button.secondary {
      background: #40516f;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #26334d;
      margin-top: 10px;
      word-wrap: break-word;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #26334d;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .number {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    #log {
      background: #080d17;
      min-height: 180px;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    .warning {
      color: #ffd166;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🤖 Deriv Trading Bot</h1>

  <div class="card">

    <label>Deriv API Token</label>
    <input
      id="token"
      type="password"
      placeholder="Enter your DEMO API token"
    >

    <label>Market</label>
    <select id="symbol">
      <option value="R_10">Volatility 10 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_100">Volatility 100 Index</option>
    </select>

    <label>Stake</label>
    <input
      id="stake"
      type="number"
      min="0.35"
      step="0.01"
      value="1"
    >

    <label>Contract Duration</label>
    <select id="duration">
      <option value="5">5 ticks</option>
      <option value="10">10 ticks</option>
      <option value="20">20 ticks</option>
      <option value="30">30 ticks</option>
    </select>

    <button onclick="connectDeriv()">
      🔌 Connect Demo Account
    </button>

    <button class="secondary" onclick="disconnectDeriv()">
      Disconnect
    </button>

    <div id="status" class="status">
      Not connected
    </div>

  </div>


  <div class="card">

    <h3>Bot Controls</h3>

    <button onclick="startBot()">
      ▶️ Start Bot
    </button>

    <button class="stop" onclick="stopBot()">
      ⛔ Stop Bot
    </button>

    <p class="warning">
      Demo testing only. Automatic trading can lose money.
      Keep the bot on demo until the strategy has been properly tested.
    </p>

  </div>


  <div class="card">

    <h3>Account</h3>

    <div class="stats">

      <div class="stat">
        Balance
        <div class="number" id="balance">
          --
        </div>
      </div>

      <div class="stat">
        Bot
        <div class="number" id="botState">
          OFF
        </div>
      </div>

    </div>

  </div>


  <div class="card">

    <h3>Trading Statistics</h3>

    <div class="stats">

      <div class="stat">
        Wins
        <div class="number" id="wins">
          0
        </div>
      </div>

      <div class="stat">
        Losses
        <div class="number" id="losses">
          0
        </div>
      </div>

      <div class="stat">
        Trades
        <div class="number" id="trades">
          0
        </div>
      </div>

      <div class="stat">
        Profit/Loss
        <div class="number" id="profit">
          0.00
        </div>
      </div>

    </div>

  </div>


  <div class="card">

    <h3>Activity Log</h3>

    <div id="log"></div>

  </div>

</div>


<script>

let ws = null;
let connected = false;
let botRunning = false;

let wins = 0;
let losses = 0;
let trades = 0;
let totalProfit = 0;

let lastContractId = null;

let tickHistory = [];
let lastTick = null;


/* --------------------------------------------------
   LOG
-------------------------------------------------- */

function log(message) {

  const logBox = document.getElementById("log");

  const time = new Date().toLocaleTimeString();

  logBox.innerHTML += `[${time}] ${message}\n`;

  logBox.scrollTop = logBox.scrollHeight;

}


/* --------------------------------------------------
   STATUS
-------------------------------------------------- */

function setStatus(message) {

  document.getElementById("status").innerText = message;

  log(message);

}


/* --------------------------------------------------
   CONNECT
-------------------------------------------------- */

function connectDeriv() {

  const token = document.getElementById("token").value.trim();

  if (!token) {

    alert("Enter your DEMO API token first.");

    return;

  }

  if (ws) {

    try {
      ws.close();
    } catch(e) {}

  }

  setStatus("Connecting to Deriv...");

  /*
    Current Deriv WebSocket endpoint.
  */

  ws = new WebSocket(
    "wss://ws.derivws.com/websockets/v3"
  );


  ws.onopen = function() {

    log("WebSocket connected.");

    ws.send(JSON.stringify({
      authorize: token
    }));

  };


  ws.onmessage = function(event) {

    let data;

    try {

      data = JSON.parse(event.data);

    } catch(e) {

      log("Invalid server response.");

      return;

    }

    handleMessage(data);

  };


  ws.onerror = function() {

    setStatus("WebSocket error.");

  };


  ws.onclose = function() {

    connected = false;

    document.getElementById("botState").innerText = "OFF";

    setStatus("Disconnected.");

  };

}


/* --------------------------------------------------
   HANDLE SERVER MESSAGES
-------------------------------------------------- */

function handleMessage(data) {

  if (data.error) {

    log(
      "ERROR: " +
      (data.error.message || "Unknown Deriv error")
    );

    return;

  }


  if (data.msg_type === "authorize") {

    connected = true;

    setStatus("Connected to Deriv.");

    log(
      "Authorized account: " +
      (data.authorize.loginid || "Demo account")
    );

    getBalance();

    subscribeTicks();

    return;

  }


  if (data.msg_type === "balance") {

    if (data.balance) {

      const value = Number(data.balance.balance);

      document.getElementById("balance").innerText =
        value.toFixed(2) +
        " " +
        (data.balance.currency || "");

    }

    return;

  }


  if (data.msg_type === "tick") {

    handleTick(data);

    return;

  }


  if (data.msg_type === "proposal") {

    handleProposal(data);

    return;

  }


  if (data.msg_type === "buy") {

    handleBuy(data);

    return;

  }


  if (data.msg_type === "proposal_open_contract") {

    handleContractUpdate(data);

    return;

  }

}


/* --------------------------------------------------
   BALANCE
-------------------------------------------------- */

function getBalance() {

  if (!ws || ws.readyState !== WebSocket.OPEN)
    return;

  ws.send(JSON.stringify({
    balance: 1,
    subscribe: 1
  }));

}


/* --------------------------------------------------
   TICKS
-------------------------------------------------- */

function subscribeTicks() {

  const symbol =
    document.getElementById("symbol").value;

  ws.send(JSON.stringify({

    ticks: symbol,
    subscribe: 1

  }));

  log("Subscribed to " + symbol);

}


/* --------------------------------------------------
   TICK PROCESSING
-------------------------------------------------- */

function handleTick(data) {

  if (!data.tick)
    return;

  const quote = Number(data.tick.quote);

  if (!Number.isFinite(quote))
    return;

  tickHistory.push(quote);

  if (tickHistory.length > 20) {

    tickHistory.shift();

  }

  lastTick = quote;

  if (!botRunning)
    return;

  /*
    VERY SIMPLE DEMO STRATEGY.

    It is intentionally conservative:
    - Requires recent tick history
    - Looks for short-term movement
    - Places only one trade at a time

    This is NOT a guaranteed profitable strategy.
  */

  if (lastContractId !== null)
    return;

  if (tickHistory.length < 10)
    return;


  const previous =
    tickHistory[tickHistory.length - 2];

  const movement = quote - previous;


  /*
    Small movement filter.
  */

  if (movement === 0)
    return;


  /*
    CALL when latest tick moved upward.
    PUT when latest tick moved downward.
  */

  if (movement > 0) {

    requestProposal("CALL");

  } else {

    requestProposal("PUT");

  }

}


/* --------------------------------------------------
   REQUEST PROPOSAL
-------------------------------------------------- */

function requestProposal(direction) {

  if (!connected)
    return;

  if (lastContractId !== null)
    return;

  const symbol =
    document.getElementById("symbol").value;

  const stake =
    Number(document.getElementById("stake").value);

  const duration =
    Number(document.getElementById("duration").value);


  if (!Number.isFinite(stake) || stake <= 0) {

    log("Invalid stake.");

    return;

  }


  const contractType =
    direction === "CALL"
      ? "CALL"
      : "PUT";


  log(
    "Requesting " +
    contractType +
    " proposal..."
  );


  ws.send(JSON.stringify({

    proposal: 1,

    amount: stake,

    basis: "stake",

    contract_type: contractType,

    currency: "USD",

    duration: duration,

    duration_unit: "t",

    symbol: symbol

  }));

}


/* --------------------------------------------------
   PROPOSAL
-------------------------------------------------- */

function handleProposal(data) {

  if (!data.proposal)
    return;

  const proposalId =
    data.proposal.id;

  const askPrice =
    Number(data.proposal.ask_price);


  if (!proposalId || !Number.isFinite(askPrice)) {

    log("Invalid proposal received.");

    return;

  }


  log(
    "Proposal received. Buying for " +
    askPrice.toFixed(2)
  );


  ws.send(JSON.stringify({

    buy: proposalId,

    price: askPrice

  }));

}


/* --------------------------------------------------
   BUY
-------------------------------------------------- */

function handleBuy(data) {

  if (!data.buy)
    return;


  const contractId =
    data.buy.contract_id;


  if (!contractId) {

    log("No contract ID received.");

    return;

  }


  lastContractId = contractId;

  trades++;

  updateStats();


  log(
    "TRADE OPENED — Contract #" +
    contractId
  );


  /*
    Subscribe to contract status.
  */

  ws.send(JSON.stringify({

    proposal_open_contract: 1,

    contract_id: contractId,

    subscribe: 1

  }));

}


/* --------------------------------------------------
   CONTRACT UPDATE
-------------------------------------------------- */

function handleContractUpdate(data) {

  if (!data.proposal_open_contract)
    return;


  const contract =
    data.proposal_open_contract;


  /*
    is_sold indicates the contract has finished.
  */

  if (
    contract.is_sold ||
    contract.status === "won" ||
    contract.status === "lost"
  ) {

    const profit =
      Number(contract.profit || 0);


    totalProfit += profit;


    if (profit > 0) {

      wins++;

      log(
        "✅ WIN +" +
        profit.toFixed(2)
      );

    } else {

      losses++;

      log(
        "❌ LOSS " +
        profit.toFixed(2)
      );

    }


    lastContractId = null;

    updateStats();

    getBalance();

  }

}


/* --------------------------------------------------
   START BOT
-------------------------------------------------- */

function startBot() {

  if (!connected) {

    alert(
      "Connect your Deriv DEMO account first."
    );

    return;

  }


  botRunning = true;

  document.getElementById("botState").innerText =
    "ON";

  log("🤖 BOT STARTED");

}


/* --------------------------------------------------
   STOP BOT
-------------------------------------------------- */

function stopBot() {

  botRunning = false;

  document.getElementById("botState").innerText =
    "OFF";

  log("⛔ BOT STOPPED");

}


/* --------------------------------------------------
   DISCONNECT
-------------------------------------------------- */

function disconnectDeriv() {

  stopBot();

  connected = false;

  if (ws) {

    ws.close();

    ws = null;

  }

  document.getElementById("status").innerText =
    "Disconnected";

  log("Disconnected from Deriv.");

}


/* --------------------------------------------------
   STATISTICS
-------------------------------------------------- */

function updateStats() {

  document.getElementById("wins").innerText =
    wins;

  document.getElementById("losses").innerText =
    losses;

  document.getElementById("trades").innerText =
    trades;

  document.getElementById("profit").innerText =
    totalProfit.toFixed(2);

}


/* --------------------------------------------------
   INITIAL MESSAGE
-------------------------------------------------- */

log(
  "Ready. Enter a DEMO API token and connect."
);

</script>

</body>
</html>
