<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Martin Deriv Demo Trading Bot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      padding: 18px;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    .card {
      background: #151c32;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #39425d;
      border-radius: 8px;
      background: #0e1426;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #connectBtn {
      background: #18a558;
      color: white;
    }

    #disconnectBtn {
      background: #555;
      color: white;
    }

    #startBtn {
      background: #246bfe;
      color: white;
    }

    #stopBtn {
      background: #d9363e;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    .warning {
      background: #3a2910;
      border: 1px solid #9c6b16;
      color: #ffd875;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: #0e1426;
      padding: 14px;
      border-radius: 9px;
    }

    .stat-title {
      color: #999;
      font-size: 13px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: bold;
      margin-top: 4px;
    }

    #log {
      background: #090d18;
      border-radius: 8px;
      padding: 12px;
      height: 220px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    .connected {
      color: #42e88a;
    }

    .stopped {
      color: #ff6b6b;
    }

    .running {
      color: #62a0ff;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Deriv Demo Trading Bot</h1>
  <div class="subtitle">Automatic Options Trading — DEMO ONLY</div>

  <div class="warning">
    ⚠️ This version is for Demo testing. Do not use real money until the bot has been thoroughly tested.
  </div>

  <div class="card">

    <label>Deriv API Token</label>
    <input
      id="token"
      type="password"
      placeholder="Paste your Demo API token"
      autocomplete="off"
    >

    <label>Deriv App ID</label>
    <input
      id="appId"
      type="text"
      placeholder="Enter your App ID"
    >

    <label>Market</label>
    <select id="market">
      <option value="R_10">Volatility 10 Index</option>
      <option value="R_25">Volatility 25 Index</option>
      <option value="R_50">Volatility 50 Index</option>
      <option value="R_75">Volatility 75 Index</option>
      <option value="R_100">Volatility 100 Index</option>
    </select>

    <label>Fixed Stake</label>
    <input
      id="stake"
      type="number"
      value="1"
      min="0.35"
      step="0.01"
    >

    <label>Duration</label>
    <select id="duration">
      <option value="5">5 ticks</option>
      <option value="10">10 ticks</option>
      <option value="20">20 ticks</option>
      <option value="30">30 ticks</option>
    </select>

    <button id="connectBtn">Connect Demo Account</button>
    <button id="disconnectBtn" disabled>Disconnect</button>

  </div>

  <div class="card">

    <button id="startBtn" disabled>▶ Start Bot</button>
    <button id="stopBtn" disabled>■ Stop Bot</button>

  </div>

  <div class="card">

    <div class="stats">

      <div class="stat">
        <div class="stat-title">Balance</div>
        <div class="stat-value" id="balance">--</div>
      </div>

      <div class="stat">
        <div class="stat-title">Bot State</div>
        <div class="stat-value" id="state">Disconnected</div>
      </div>

      <div class="stat">
        <div class="stat-title">Wins</div>
        <div class="stat-value" id="wins">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Losses</div>
        <div class="stat-value" id="losses">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Trades</div>
        <div class="stat-value" id="trades">0</div>
      </div>

      <div class="stat">
        <div class="stat-title">Profit / Loss</div>
        <div class="stat-value" id="profit">0.00</div>
      </div>

    </div>

  </div>

  <div class="card">
    <strong>Activity Log</strong>
    <div id="log"></div>
  </div>

</div>

<script>

const API_BASE = "https://api.derivws.com";

let ws = null;
let accountId = null;

let connected = false;
let botRunning = false;

let currentContractId = null;
let currentProposalId = null;

let wins = 0;
let losses = 0;
let trades = 0;
let totalProfit = 0;

let previousPrice = null;
let tickCount = 0;

let requestId = 1;

const $ = id => document.getElementById(id);

function log(message) {
  const time = new Date().toLocaleTimeString();

  const line = `[${time}] ${message}`;

  $("log").textContent += line + "\n";
  $("log").scrollTop = $("log").scrollHeight;

  console.log(line);
}

function setState(text, type = "") {
  $("state").textContent = text;
  $("state").className = "stat-value " + type;
}

function getToken() {
  return $("token").value.trim();
}

function getAppId() {
  return $("appId").value.trim();
}

function getMarket() {
  return $("market").value;
}

function getStake() {
  return Number($("stake").value);
}

function getDuration() {
  return Number($("duration").value);
}

function send(data) {

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log("WebSocket is not connected.");
    return false;
  }

  data.req_id = requestId++;

  ws.send(JSON.stringify(data));

  return true;
}


/* =========================================================
   CONNECT
========================================================= */

$("connectBtn").onclick = async function () {

  const token = getToken();
  const appId = getAppId();

  if (!token) {
    alert("Enter your Demo API token.");
    return;
  }

  if (!appId) {
    alert("Enter your Deriv App ID.");
    return;
  }

  $("connectBtn").disabled = true;

  log("Connecting to Deriv Demo...");

  try {

    const response = await fetch(
      API_BASE + "/trading/v1/options/accounts",
      {
        method: "GET",

        headers: {
          "Authorization": "Bearer " + token,
          "Deriv-App-ID": appId,
          "Content-Type": "application/json"
        }
      }
    );

    const result = await response.json();

    console.log("Accounts response:", result);

    if (!response.ok) {

      throw new Error(
        result.message ||
        result.error ||
        "Could not retrieve Deriv accounts."
      );

    }

    const accounts =
      result.data ||
      result.accounts ||
      [];

    if (!Array.isArray(accounts)) {
      throw new Error("Unexpected accounts response.");
    }

    const demoAccount = accounts.find(account => {

      return (
        account.is_demo === true ||
        account.demo === true ||
        account.account_type === "demo" ||
        account.environment === "demo"
      );

    });

    if (!demoAccount) {

      throw new Error(
        "No Demo account was found for this token."
      );

    }

    accountId =
      demoAccount.id ||
      demoAccount.account_id ||
      demoAccount.loginid;

    if (!accountId) {
      throw new Error("Demo account ID was not returned.");
    }

    log("Demo account found.");

    log("Requesting authenticated WebSocket...");

    const otpResponse = await fetch(
      API_BASE +
      "/trading/v1/options/accounts/" +
      encodeURIComponent(accountId) +
      "/otp",
      {
        method: "POST",

        headers: {
          "Authorization": "Bearer " + token,
          "Deriv-App-ID": appId,
          "Content-Type": "application/json"
        }
      }
    );

    const otpResult = await otpResponse.json();

    console.log("OTP response:", otpResult);

    if (!otpResponse.ok) {

      throw new Error(
        otpResult.message ||
        otpResult.error ||
        "Could not create WebSocket session."
      );

    }

    const wsUrl =
      otpResult?.data?.url ||
      otpResult?.url;

    if (!wsUrl) {
      throw new Error("No WebSocket URL was returned.");
    }

    openWebSocket(wsUrl);

  } catch (error) {

    console.error(error);

    log("Connection error: " + error.message);

    $("connectBtn").disabled = false;

    setState("Disconnected", "stopped");
  }

};


/* =========================================================
   WEBSOCKET
========================================================= */

function openWebSocket(url) {

  try {

    ws = new WebSocket(url);

  } catch (error) {

    log("WebSocket creation failed: " + error.message);

    $("connectBtn").disabled = false;

    return;
  }


  ws.onopen = function () {

    connected = true;

    log("Connected to DEMO Deriv account.");

    setState("Connected", "connected");

    $("disconnectBtn").disabled = false;
    $("startBtn").disabled = false;

    subscribeBalance();

    subscribeTicks();

  };


  ws.onmessage = function (event) {

    try {

      const data = JSON.parse(event.data);

      handleMessage(data);

    } catch (error) {

      console.error(
        "Message parsing error:",
        error,
        event.data
      );

    }

  };


  ws.onerror = function (error) {

    console.error("WebSocket error:", error);

    log("WebSocket error.");

  };


  ws.onclose = function () {

    connected = false;
    botRunning = false;

    currentContractId = null;
    currentProposalId = null;

    log("Disconnected from Deriv.");

    setState("Disconnected", "stopped");

    $("connectBtn").disabled = false;
    $("disconnectBtn").disabled = true;
    $("startBtn").disabled = true;
    $("stopBtn").disabled = true;

  };

}


/* =========================================================
   HANDLE DERIV MESSAGES
========================================================= */

function handleMessage(data) {

  if (data.error) {

    log(
      "Deriv error: " +
      (
        data.error.message ||
        data.error.code ||
        JSON.stringify(data.error)
      )
    );

    currentProposalId = null;

    return;
  }


  switch (data.msg_type) {

    case "balance":

      handleBalance(data);

      break;


    case "tick":

      handleTick(data);

      break;


    case "proposal":

      handleProposal(data);

      break;


    case "buy":

      handleBuy(data);

      break;


    case "proposal_open_contract":

      handleContractUpdate(data);

      break;


    default:

      console.log(
        "Deriv message:",
        data
      );

  }

}


/* =========================================================
   BALANCE
========================================================= */

function subscribeBalance() {

  send({
    balance: 1,
    subscribe: 1
  });

  log("Balance stream requested.");

}


function handleBalance(data) {

  const balance =
    data.balance?.balance;

  if (balance !== undefined) {

    $("balance").textContent =
      Number(balance).toFixed(2);

  }

}


/* =========================================================
   TICKS
========================================================= */

function subscribeTicks() {

  const market = getMarket();

  previousPrice = null;
  tickCount = 0;

  send({
    ticks: market,
    subscribe: 1
  });

  log("Live ticks requested for " + market);

}


function handleTick(data) {

  const price =
    Number(data.tick?.quote);

  if (!Number.isFinite(price)) {
    return;
  }

  tickCount++;

  if (previousPrice === null) {

    previousPrice = price;

    log(
      "First tick: " +
      price
    );

    return;
  }


  const direction =
    price > previousPrice
      ? "UP"
      : price < previousPrice
        ? "DOWN"
        : "FLAT";


  if (
    botRunning &&
    !currentContractId &&
    !currentProposalId &&
    tickCount >= 10
  ) {

    if (direction === "UP") {

      requestProposal("CALL");

    } else if (direction === "DOWN") {

      requestProposal("PUT");

    }

  }


  previousPrice = price;

}


/* =========================================================
   PROPOSAL
========================================================= */

function requestProposal(contractType) {

  if (!connected) {
    return;
  }

  if (currentContractId || currentProposalId) {
    return;
  }


  const stake = getStake();
  const duration = getDuration();
  const market = getMarket();


  if (!Number.isFinite(stake) || stake <= 0) {

    log("Invalid stake.");

    return;
  }


  if (!Number.isFinite(duration) || duration <= 0) {

    log("Invalid duration.");

    return;
  }


  currentProposalId = "REQUESTING";


  log(
    "Requesting " +
    contractType +
    " proposal..."
  );


  /*
    IMPORTANT:
    New Deriv API uses:
    underlying_symbol
    instead of:
    symbol
  */

  send({

    proposal: 1,

    amount: stake,

    basis: "stake",

    contract_type: contractType,

    currency: "USD",

    duration: duration,

    duration_unit: "t",

    underlying_symbol: market,

    subscribe: 1

  });

}


/* =========================================================
   PROPOSAL RESPONSE
========================================================= */

function handleProposal(data) {

  const proposal =
    data.proposal;

  if (!proposal) {

    currentProposalId = null;

    log(
      "Proposal response did not contain proposal data."
    );

    return;
  }


  const proposalId =
    proposal.id;


  if (!proposalId) {

    currentProposalId = null;

    log(
      "Deriv returned a proposal without an ID."
    );

    return;
  }


  currentProposalId = proposalId;


  const askPrice =
    Number(proposal.ask_price);


  if (!Number.isFinite(askPrice)) {

    currentProposalId = null;

    log(
      "Invalid proposal price."
    );

    return;
  }


  log(
    "Proposal received. Price: " +
    askPrice
  );


  buyContract(
    proposalId,
    askPrice
  );

}


/* =========================================================
   BUY
========================================================= */

function buyContract(proposalId, price) {

  log(
    "Buying contract..."
  );


  send({

    buy: proposalId,

    price: price

  });

}


/* =========================================================
   BUY RESPONSE
========================================================= */

function handleBuy(data) {

  currentProposalId = null;


  const buy =
    data.buy;


  if (!buy) {

    log(
      "Buy response was empty."
    );

    return;
  }


  const contractId =
    buy.contract_id;


  if (!contractId) {

    log(
      "Contract ID was not returned."
    );

    return;
  }


  currentContractId =
    contractId;


  trades++;

  $("trades").textContent =
    trades;


  log(
    "TRADE OPENED. Contract ID: " +
    contractId
  );


  subscribeContract(
    contractId
  );

}


/* =========================================================
   CONTRACT MONITORING
========================================================= */

function subscribeContract(contractId) {

  send({

    proposal_open_contract: 1,

    contract_id: contractId,

    subscribe: 1

  });


  log(
    "Monitoring contract..."
  );

}


/* =========================================================
   CONTRACT UPDATE
========================================================= */

function handleContractUpdate(data) {

  const contract =
    data.proposal_open_contract;


  if (!contract) {
    return;
  }


  const profit =
    Number(contract.profit);


  if (Number.isFinite(profit)) {

    $("profit").textContent =
      totalProfit.toFixed(2);

  }


  /*
    Deriv can report the final state
    using is_sold / status.
  */

  const finished =
    contract.is_sold === 1 ||
    contract.is_sold === true ||
    contract.status === "sold" ||
    contract.status === "won" ||
    contract.status === "lost";


  if (!finished) {

    return;

  }


  /*
    Prevent counting the same contract twice.
  */

  if (
    contract._countedByMartinBot
  ) {

    return;

  }


  contract._countedByMartinBot = true;


  const finalProfit =
    Number(contract.profit);


  if (
    Number.isFinite(finalProfit) &&
    finalProfit > 0
  ) {

    wins++;

    totalProfit += finalProfit;

    $("wins").textContent =
      wins;

    $("profit").textContent =
      totalProfit.toFixed(2);


    log(
      "✅ WIN — Profit: " +
      finalProfit.toFixed(2)
    );


  } else {

    losses++;

    if (Number.isFinite(finalProfit)) {

      totalProfit += finalProfit;

    }


    $("losses").textContent =
      losses;

    $("profit").textContent =
      totalProfit.toFixed(2);


    log(
      "❌ LOSS — Result: " +
      (
        Number.isFinite(finalProfit)
          ? finalProfit.toFixed(2)
          : "0.00"
      )
    );

  }


  currentContractId = null;


  log(
    "Contract finished. Waiting for next signal..."
  );

}


/* =========================================================
   START BOT
========================================================= */

$("startBtn").onclick = function () {

  if (!connected) {

    alert(
      "Connect to the Demo account first."
    );

    return;
  }


  botRunning = true;

  tickCount = 0;

  previousPrice = null;

  setState(
    "BOT RUNNING",
    "running"
  );


  $("startBtn").disabled = true;
  $("stopBtn").disabled = false;


  log(
    "🤖 BOT STARTED — Demo trading only."
  );

};


/* =========================================================
   STOP BOT
========================================================= */

$("stopBtn").onclick = function () {

  botRunning = false;

  currentProposalId = null;


  setState(
    "BOT STOPPED",
    "stopped"
  );


  $("startBtn").disabled = false;
  $("stopBtn").disabled = true;


  log(
    "🛑 BOT STOPPED."
  );

};


/* =========================================================
   DISCONNECT
========================================================= */

$("disconnectBtn").onclick = function () {

  botRunning = false;

  currentContractId = null;
  currentProposalId = null;


  if (ws) {

    try {
      ws.close();
    } catch (e) {}

  }


  ws = null;

  connected = false;


  setState(
    "Disconnected",
    "stopped"
  );


  log(
    "Disconnected manually."
  );

};


/* =========================================================
   INITIAL STATE
========================================================= */

setState(
  "Disconnected",
  "stopped"
);

log(
  "Bot ready. Enter Demo token and App ID."
);

</script>

</body>
</html>
