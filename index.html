<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deriv Demo Trading Bot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b1220;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 20px;
}

.card {
    background: #151f33;
    border-radius: 15px;
    padding: 18px;
    margin-bottom: 15px;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;
}

input,
select,
button {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

input,
select {
    background: #26334d;
    color: white;
}

button {
    margin-top: 10px;
    background: #00a86b;
    color: white;
    font-weight: bold;
}

button.stop {
    background: #d93636;
}

button.secondary {
    background: #40516f;
}

.status {
    background: #26334d;
    padding: 12px;
    margin-top: 12px;
    border-radius: 8px;
    word-break: break-word;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    background: #26334d;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.number {
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
}

#log {
    background: #080d17;
    min-height: 180px;
    max-height: 300px;
    overflow-y: auto;
    padding: 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
}

.warning {
    font-size: 13px;
    line-height: 1.5;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 Deriv Demo Trading Bot</h1>

<div class="card">

<label>Deriv API Token</label>

<input
    id="token"
    type="password"
    placeholder="Paste your Demo PAT here"
>

<label>Deriv App ID</label>

<input
    id="appId"
    type="text"
    placeholder="Enter your Deriv App ID"
>

<button onclick="connectDeriv()">
    🔌 Connect Demo Account
</button>

<button class="secondary" onclick="disconnectDeriv()">
    Disconnect
</button>

<div id="status" class="status">
    Not connected
</div>

</div>


<div class="card">

<h3>Trading Settings</h3>

<label>Market</label>

<select id="symbol">

<option value="R_10">
Volatility 10 Index
</option>

<option value="R_25">
Volatility 25 Index
</option>

<option value="R_50">
Volatility 50 Index
</option>

<option value="R_75">
Volatility 75 Index
</option>

<option value="R_100">
Volatility 100 Index
</option>

</select>


<label>Stake</label>

<input
    id="stake"
    type="number"
    value="1"
    min="0.35"
    step="0.01"
>


<label>Duration</label>

<select id="duration">

<option value="5">
5 ticks
</option>

<option value="10">
10 ticks
</option>

<option value="20">
20 ticks
</option>

<option value="30">
30 ticks
</option>

</select>

</div>


<div class="card">

<h3>Bot Controls</h3>

<button onclick="startBot()">
▶️ Start Bot
</button>

<button class="stop" onclick="stopBot()">
⛔ Stop Bot
</button>

<p class="warning">
The bot is DEMO ONLY while we test it.
Do not connect a real-money account.
</p>

</div>


<div class="card">

<h3>Account</h3>

<div class="stats">

<div class="stat">
Balance
<div class="number" id="balance">
--
</div>
</div>

<div class="stat">
Bot
<div class="number" id="botState">
OFF
</div>
</div>

</div>

</div>


<div class="card">

<h3>Trading Statistics</h3>

<div class="stats">

<div class="stat">
Wins
<div class="number" id="wins">
0
</div>
</div>

<div class="stat">
Losses
<div class="number" id="losses">
0
</div>
</div>

<div class="stat">
Trades
<div class="number" id="trades">
0
</div>
</div>

<div class="stat">
Profit/Loss
<div class="number" id="profit">
0.00
</div>
</div>

</div>

</div>


<div class="card">

<h3>Activity Log</h3>

<div id="log"></div>

</div>

</div>


<script>

const API_BASE =
    "https://api.derivws.com";

let ws = null;

let connected = false;

let botRunning = false;

let selectedAccount = null;

let tickHistory = [];

let activeContract = null;

let wins = 0;

let losses = 0;

let trades = 0;

let totalProfit = 0;


/* =========================
   LOGGING
========================= */

function log(message) {

    const box =
        document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    box.innerHTML +=
        "[" + time + "] " +
        message +
        "\n";

    box.scrollTop =
        box.scrollHeight;
}


/* =========================
   STATUS
========================= */

function status(message) {

    document.getElementById("status")
        .innerText = message;

    log(message);
}


/* =========================
   CONNECT
========================= */

async function connectDeriv() {

    const token =
        document.getElementById("token")
        .value
        .trim();

    const appId =
        document.getElementById("appId")
        .value
        .trim();


    if (!token) {

        alert(
            "Please enter your Demo API token."
        );

        return;
    }


    if (!appId) {

        alert(
            "Please enter your Deriv App ID."
        );

        return;
    }


    disconnectDeriv();


    try {

        status(
            "Connecting to Deriv account..."
        );


        /*
         STEP 1:
         Get all Options accounts
        */

        const response =
            await fetch(
                API_BASE +
                "/trading/v1/options/accounts",
                {

                    method: "GET",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Deriv-App-ID":
                            appId,

                        "Content-Type":
                            "application/json"
                    }

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                getError(result)
            );

        }


        const accounts =
            result.data || [];


        if (!accounts.length) {

            throw new Error(
                "No Options accounts were found."
            );

        }


        /*
         STEP 2:
         Find Demo account
        */

        selectedAccount =
            accounts.find(account => {

                const type =
                    String(
                        account.account_type ||
                        account.type ||
                        ""
                    ).toLowerCase();

                const environment =
                    String(
                        account.environment ||
                        ""
                    ).toLowerCase();

                return (
                    type === "demo" ||
                    environment === "demo"
                );

            });


        /*
         Some API responses may identify
         demo accounts differently.
        */

        if (!selectedAccount) {

            selectedAccount =
                accounts.find(account => {

                    return (
                        account.is_demo === true ||
                        account.demo === true
                    );

                });

        }


        if (!selectedAccount) {

            throw new Error(
                "I could not identify a Demo account. No WebSocket was opened."
            );

        }


        const accountId =
            selectedAccount.account_id ||
            selectedAccount.id;


        if (!accountId) {

            throw new Error(
                "Demo account ID was not returned by Deriv."
            );

        }


        log(
            "Demo account found: " +
            accountId
        );


        /*
         STEP 3:
         Get one-time WebSocket URL
        */

        status(
            "Requesting secure Demo connection..."
        );


        const otpResponse =
            await fetch(

                API_BASE +
                "/trading/v1/options/accounts/" +
                encodeURIComponent(accountId) +
                "/otp",

                {

                    method: "POST",

                    headers: {

                        "Authorization":
                            "Bearer " + token,

                        "Deriv-App-ID":
                            appId

                    }

                }

            );


        const otpResult =
            await otpResponse.json();


        if (!otpResponse.ok) {

            throw new Error(
                getError(otpResult)
            );

        }


        const wsUrl =
            otpResult?.data?.url;


        if (!wsUrl) {

            throw new Error(
                "Deriv did not return a WebSocket URL."
            );

        }


        log(
            "Secure Demo WebSocket URL received."
        );


        /*
         STEP 4:
         Connect using the OTP URL
        */

        ws =
            new WebSocket(wsUrl);


        ws.onopen = function() {

            connected = true;

            status(
                "✅ Connected to DEMO Deriv account."
            );


            subscribeBalance();

            subscribeTicks();

        };


        ws.onmessage =
            function(event) {

                let data;

                try {

                    data =
                        JSON.parse(
                            event.data
                        );

                } catch(error) {

                    log(
                        "Could not read server response."
                    );

                    return;

                }


                handleMessage(data);

            };


        ws.onerror =
            function() {

                status(
                    "WebSocket connection error."
                );

            };


        ws.onclose =
            function() {

                connected = false;

                botRunning = false;

                activeContract = null;

                document.getElementById(
                    "botState"
                ).innerText = "OFF";

                log(
                    "WebSocket disconnected."
                );

            };

    }

    catch(error) {

        connected = false;

        status(
            "Connection failed: " +
            error.message
        );

        console.error(error);

    }

}


/* =========================
   ERROR HANDLING
========================= */

function getError(result) {

    if (
        result &&
        result.errors &&
        result.errors.length
    ) {

        return (
            result.errors[0].message ||
            "Deriv API error."
        );

    }


    if (result && result.message) {

        return result.message;

    }


    return "Unknown Deriv API error.";

}


/* =========================
   MESSAGE HANDLER
========================= */

function handleMessage(data) {

    if (data.error) {

        log(
            "Deriv error: " +
            (
                data.error.message ||
                "Unknown error"
            )
        );

        return;
    }


    if (data.msg_type === "balance") {

        updateBalance(data);

        return;
    }


    if (data.msg_type === "tick") {

        handleTick(data);

        return;
    }


    if (
        data.msg_type ===
        "proposal"
    ) {

        handleProposal(data);

        return;
    }


    if (
        data.msg_type ===
        "buy"
    ) {

        handleBuy(data);

        return;
    }


    if (
        data.msg_type ===
        "proposal_open_contract"
    ) {

        handleContract(data);

        return;
    }

}


/* =========================
   BALANCE
========================= */

function subscribeBalance() {

    if (!ws ||
        ws.readyState !== WebSocket.OPEN)
        return;


    ws.send(
        JSON.stringify({

            balance: 1,

            subscribe: 1

        })
    );

}


/* =========================
   UPDATE BALANCE
========================= */

function updateBalance(data) {

    if (!data.balance)
        return;


    const value =
        Number(
            data.balance.balance
        );


    const currency =
        data.balance.currency ||
        "";


    if (
        Number.isFinite(value)
    ) {

        document.getElementById(
            "balance"
        ).innerText =
            value.toFixed(2) +
            " " +
            currency;

    }

}


/* =========================
   TICKS
========================= */

function subscribeTicks() {

    if (!ws ||
        ws.readyState !== WebSocket.OPEN)
        return;


    const symbol =
        document.getElementById(
            "symbol"
        ).value;


    ws.send(
        JSON.stringify({

            ticks:
                symbol,

            subscribe:
                1

        })
    );


    log(
        "Live ticks subscribed: " +
        symbol
    );

}


/* =========================
   TICK PROCESSING
========================= */

function handleTick(data) {

    if (!data.tick)
        return;


    const quote =
        Number(
            data.tick.quote
        );


    if (!Number.isFinite(quote))
        return;


    tickHistory.push(
        quote
    );


    if (
        tickHistory.length >
        20
    ) {

        tickHistory.shift();

    }


    /*
     IMPORTANT:
     Do not trade while disconnected
     or while a contract is active.
    */

    if (!botRunning)
        return;


    if (activeContract)
        return;


    if (
        tickHistory.length <
        10
    )
        return;


    const previous =
        tickHistory[
            tickHistory.length - 2
        ];


    if (quote === previous)
        return;


    if (quote > previous) {

        requestProposal(
            "CALL"
        );

    }

    else {

        requestProposal(
            "PUT"
        );

    }

}


/* =========================
   PROPOSAL
========================= */

function requestProposal(
    direction
) {

    if (!connected)
        return;


    if (activeContract)
        return;


    const symbol =
        document.getElementById(
            "symbol"
        ).value;


    const stake =
        Number(
            document.getElementById(
                "stake"
            ).value
        );


    const duration =
        Number(
            document.getElementById(
                "duration"
            ).value
        );


    if (
        !Number.isFinite(stake) ||
        stake <= 0
    ) {

        log(
            "Invalid stake."
        );

        return;

    }


    const contractType =
        direction === "CALL"
            ? "CALL"
            : "PUT";


    log(
        "Requesting " +
        contractType +
        " proposal..."
    );


    ws.send(
        JSON.stringify({

            proposal: 1,

            amount: stake,

            basis: "stake",

            contract_type:
                contractType,

            currency: "USD",

            duration:
                duration,

            duration_unit:
                "t",

            symbol:
                symbol

        })
    );

}


/* =========================
   PROPOSAL RESPONSE
========================= */

function handleProposal(data) {

    if (!data.proposal)
        return;


    const proposalId =
        data.proposal.id;


    const askPrice =
        Number(
            data.proposal.ask_price
        );


    if (
        !proposalId ||
        !Number.isFinite(
            askPrice
        )
    ) {

        log(
            "Invalid proposal."
        );

        return;

    }


    log(
        "Proposal received."
    );


    /*
     Buy exactly the proposal price.
    */

    ws.send(
        JSON.stringify({

            buy:
                proposalId,

            price:
                askPrice

        })
    );

}


/* =========================
   BUY RESPONSE
========================= */

function handleBuy(data) {

    if (!data.buy)
        return;


    const contractId =
        data.buy.contract_id;


    if (!contractId) {

        log(
            "Trade was not opened."
        );

        return;

    }


    activeContract =
        contractId;


    trades++;


    updateStats();


    log(
        "🟢 DEMO TRADE OPENED: " +
        contractId
    );


    /*
     Subscribe to contract status.
    */

    ws.send(
        JSON.stringify({

            proposal_open_contract:
                1,

            contract_id:
                contractId,

            subscribe:
                1

        })
    );

}


/* =========================
   CONTRACT STATUS
========================= */

function handleContract(data) {

    if (
        !data.proposal_open_contract
    )
        return;


    const contract =
        data.proposal_open_contract;


    if (
        contract.is_sold ||
        contract.status === "won" ||
        contract.status === "lost"
    ) {

        const profit =
            Number(
                contract.profit || 0
            );


        totalProfit +=
            profit;


        if (profit > 0) {

            wins++;

            log(
                "✅ DEMO WIN: +" +
                profit.toFixed(2)
            );

        }

        else {

            losses++;

            log(
                "❌ DEMO LOSS: " +
                profit.toFixed(2)
            );

        }


        activeContract =
            null;


        updateStats();

    }

}


/* =========================
   START BOT
========================= */

function startBot() {

    if (!connected) {

        alert(
            "Connect your DEMO account first."
        );

        return;

    }


    botRunning = true;


    document.getElementById(
        "botState"
    ).innerText =
        "ON";


    log(
        "🤖 DEMO BOT STARTED."
    );

}


/* =========================
   STOP BOT
========================= */

function stopBot() {

    botRunning = false;


    document.getElementById(
        "botState"
    ).innerText =
        "OFF";


    log(
        "⛔ BOT STOPPED."
    );

}


/* =========================
   DISCONNECT
========================= */

function disconnectDeriv() {

    botRunning = false;

    connected = false;

    activeContract = null;


    if (ws) {

        try {

            ws.close();

        }

        catch(error) {}

    }


    ws = null;


    document.getElementById(
        "botState"
    ).innerText =
        "OFF";

}


/* =========================
   STATS
========================= */

function updateStats() {

    document.getElementById(
        "wins"
    ).innerText =
        wins;


    document.getElementById(
        "losses"
    ).innerText =
        losses;


    document.getElementById(
        "trades"
    ).innerText =
        trades;


    document.getElementById(
        "profit"
    ).innerText =
        totalProfit.toFixed(2);

}


/* =========================
   STARTUP
========================= */

log(
    "Bot ready."
);

log(
    "DEMO mode only."
);

log(
    "Enter your PAT and Deriv App ID."
);

</script>

</body>
</html>
